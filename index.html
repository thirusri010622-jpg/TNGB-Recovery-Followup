<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#003366">
  <title>TNGB Recovery & Follow-up</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root{--blue:#003366;--light:#00529b;--green:#15803d;--red:#b91c1c;--bg:#f0f2f5;--text:#1e293b;--sub:#64748b;--border:#e2e8f0}*{box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{margin:0;padding:0 0 80px;background:var(--bg);color:var(--text)}header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--blue),var(--light));color:#fff;padding:12px 16px;box-shadow:0 2px 10px #0002}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{display:flex;align-items:center;gap:10px}.logo{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;font-weight:800}.title h1{font-size:14px;margin:0}.title p{font-size:11px;margin:2px 0 0}.branch{font-size:10px;background:#ffffff30;padding:5px 8px;border-radius:12px}.search{margin-top:10px;width:100%;border:0;border-radius:8px;padding:10px;font-size:14px}.tabs{position:sticky;top:96px;z-index:4;display:flex;background:#fff;border-bottom:1px solid var(--border)}.tab{flex:1;padding:11px 3px;border:0;border-bottom:2px solid transparent;background:#fff;color:var(--sub);font-weight:650;font-size:12px}.tab.active{border-bottom-color:var(--blue);color:var(--blue)}.count{background:var(--red);color:white;border-radius:10px;padding:1px 5px;margin-left:3px;font-size:10px}.container{max-width:680px;margin:auto;padding:12px}.card{background:white;border:1px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 3px #0000000c}.cardhead{padding:11px 14px;background:#f8fafc;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:8px}.name{font-size:13px;font-weight:750;color:var(--blue)}.meta,.label{font-size:11px;color:var(--sub);margin-top:3px}.total{text-align:right;font-size:14px;font-weight:800;color:var(--red);white-space:nowrap}.loan{padding:10px 14px;border-bottom:1px dashed var(--border);font-size:12px}.loan:last-of-type{border-bottom:0}.loanline{display:flex;justify-content:space-between;gap:8px;font-weight:650}.grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px;font-size:11px;color:#334155}.grid span{color:var(--sub)}.follow{margin:8px 14px;padding:9px 11px;background:#fefce8;border:1px solid #fef08a;border-radius:7px;font-size:11px;color:#713f12}.actions{display:flex;justify-content:flex-end;gap:8px;padding:8px 14px;background:#fafafa;border-top:1px solid var(--border)}button{cursor:pointer}.act{border:0;border-radius:6px;padding:7px 10px;font-size:11px;font-weight:650}.edit{background:#e0f2fe;color:#0369a1}.followbtn{background:#dcfce7;color:var(--green)}.fab{position:fixed;right:17px;bottom:18px;border:0;border-radius:50%;width:52px;height:52px;background:var(--blue);color:#fff;font-size:27px;box-shadow:0 4px 12px #0004;z-index:6}.empty{text-align:center;padding:42px 12px;color:#94a3b8}.modal{display:none;position:fixed;inset:0;z-index:10;background:#0008;padding:14px;align-items:center;justify-content:center}.modal.open{display:flex}.modalbox{background:#fff;border-radius:12px;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:16px}.modalbox h2{font-size:16px;color:var(--blue);margin:0 0 12px}.form{margin:9px 0}.form label{display:block;color:var(--sub);font-size:11px;font-weight:650;margin-bottom:4px}.form input,.form select,.form textarea{width:100%;padding:9px;border:1px solid var(--border);border-radius:6px;font-size:13px}.loanrow{border:1px solid #cbd5e1;border-radius:7px;padding:9px;margin:8px 0;background:#f8fafc}.loanrow h3{margin:0 0 6px;font-size:12px;color:#0369a1}.loanform{display:grid;grid-template-columns:1fr 1fr;gap:7px}.buttons{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.save,.cancel,.addloan{border:0;border-radius:6px;padding:9px 14px;font-weight:650}.save{background:var(--blue);color:#fff}.cancel{background:#f1f5f9;color:var(--sub)}.addloan{background:#e0f2fe;color:#0369a1;padding:7px 10px;font-size:11px}.visually-hidden{position:absolute;left:-10000px}
  </style>
</head>
<body>
<header><div class="head"><div class="brand"><div class="logo">TN</div><div class="title"><h1>தமிழ்நாடு கிராம வங்கி</h1><p>Branch Recovery &amp; Follow-up Portal</p></div></div><div class="branch">VALAPADI / BATLAGUNDU</div></div><input class="search" id="search" type="search" placeholder="Search CIF, borrower, account number…" aria-label="Search records"></header>
<nav class="tabs" aria-label="Record categories"><button class="tab active" data-tab="today">இன்று (Today) <span class="count" id="todayCount">0</span></button><button class="tab" data-tab="npa">NPA போர்ட்ஃபோலியோ <span class="count" id="npaCount">0</span></button><button class="tab" data-tab="deposit">டெபாசிட் ஃபாலோ-அப் <span class="count" id="depositCount">0</span></button></nav>
<main class="container" id="records"></main><button class="fab" id="newRecord" aria-label="Add record">+</button>
<div class="modal" id="recordModal"><section class="modalbox"><h2 id="recordTitle">CIF விவரங்கள்</h2><input id="recordCif" type="hidden"><div class="form"><label for="cif">CIF Number</label><input id="cif" required></div><div class="form"><label for="name">Borrower / Group Name</label><input id="name" required></div><div class="form"><label for="branch">Branch / Village</label><input id="branch" value="VALAPADI"></div><div class="form"><label for="recordType">Record Type</label><select id="recordType"><option value="NPA">NPA</option><option value="Deposit">Deposit</option></select></div><div id="loanEditor"></div><button class="addloan" id="addLoan" type="button">+ Add Another Loan</button><div class="buttons"><button class="cancel" data-close="recordModal">Cancel</button><button class="save" id="saveRecord">Save</button></div></section></div>
<div class="modal" id="followModal"><section class="modalbox"><h2>ஃபாலோ-அப் பதிவு (Follow-up Entry)</h2><div class="form"><label for="contact">Contact Person / Representative</label><input id="contact" placeholder="தலைவர் / உறுப்பினர் / கடன் வாங்கியவர்"></div><div class="form"><label for="visit">Visit Type</label><select id="visit"><option>கள ஆய்வு (Field Visit)</option><option>தொலைபேசி அழைப்பு (Phone Call)</option><option>வங்கிக்கு நேரில் வந்தார் (Branch Visit)</option><option>நோட்டீஸ் வழங்கப்பட்டது (Notice Served)</option></select></div><div class="form"><label for="nextDate">PTP / Next Visit Date</label><input id="nextDate" type="date"></div><div class="form"><label for="amount">PTP Amount ₹</label><input id="amount" type="number" min="0"></div><div class="form"><label for="remarks">Staff Remarks</label><textarea id="remarks" rows="3"></textarea></div><div class="buttons"><button class="cancel" data-close="followModal">Cancel</button><button class="save" id="saveFollow">Save Follow-up</button></div></section></div>
<script>
const today=()=>new Date().toISOString().slice(0,10);
const seed=[{cif:'10219060796',name:'GMO ABDUL KALAM JLG',branch:'VALAPADI',type:'NPA',loans:[{accNo:'10219060796',type:'JLG Micro Crop Loan',limit:100000,balance:91240,npaDate:'2026-05-04',moiDate:'2026-06-30',category:'Sub-Standard',docStatus:'Live Documents'},{accNo:'10219060797',type:'JLG Animal Husbandry',limit:50000,balance:42100,npaDate:'2026-05-04',moiDate:'2026-06-30',category:'Sub-Standard',docStatus:'Live Documents'}],followUp:{contactPerson:'தலைவர் அப்துல்',visitType:'கள ஆய்வு (Field Visit)',nextDate:today(),amount:25000,remarks:'இன்று வங்கியில வந்து முதல் தவணை கட்டுவதாக சொல்லியுள்ளார்.'}},{cif:'86760971',name:'Csg Indra Nagar 2nd S H G',branch:'VALAPADI',type:'NPA',loans:[{accNo:'86760971',type:'SHG Direct Linkage',limit:150000,balance:60500,npaDate:'2012-01-21',moiDate:'2013-03-31',category:'Doubtful-3',docStatus:'Time Barred'}],followUp:{contactPerson:'அனிமேட்டர் மேரி',visitType:'கள ஆய்வு (Field Visit)',nextDate:new Date(Date.now()+86400000).toISOString().slice(0,10),amount:60500,remarks:'OTS மூலம் முடித்துக் கொள்வதாக தெரிவித்துள்ளனர்.'}},{cif:'10225212268',name:'GMO ABIKSHA JLG',branch:'VALAPADI',type:'NPA',loans:[{accNo:'10225212268',type:'JLG Crop Loan',limit:100000,balance:79084,npaDate:'2026-04-20',moiDate:'2026-06-30',category:'Sub-Standard',docStatus:'Live Documents'}]},{cif:'10118387208',name:'GMO ABINAYA JLG',branch:'VALAPADI',type:'NPA',loans:[{accNo:'10118387208',type:'JLG Crop Loan',limit:80000,balance:69551,npaDate:'2023-10-28',moiDate:'2024-03-31',category:'Doubtful-1',docStatus:'Live Documents'}]},{cif:'10038477601',name:'GMO ANBUMALAR JLG',branch:'VALAPADI',type:'NPA',loans:[{accNo:'10038477601',type:'JLG Loan',limit:100000,balance:84200,npaDate:'2026-05-15',moiDate:'2026-06-30',category:'Sub-Standard',docStatus:'Live Documents'}]},{cif:'9004123541',name:'Murugan K - Term Deposit',branch:'VALAPADI',type:'Deposit',loans:[{accNo:'9004123541',type:'Fixed Deposit (FD)',limit:250000,balance:250000,npaDate:'-',moiDate:'-',category:'Maturity Due',docStatus:'Active'}],followUp:{contactPerson:'முருகன் (வாடிக்கையாளர்)',visitType:'தொலைபேசி அழைப்பு (Phone Call)',nextDate:today(),amount:250000,remarks:'இன்று வங்கியில வந்து FD Renewal செய்வதாக கூறியுள்ளார்.'}}];
let data;try{data=JSON.parse(localStorage.getItem('tngb_data'))||seed}catch{data=seed}let tab='today',activeCif=null;
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
function persist(){localStorage.setItem('tngb_data',JSON.stringify(data));render()}
function render(){const q=document.querySelector('#search').value.trim().toLowerCase();let rows=data.filter(x=>tab==='today'?x.followUp?.nextDate===today():tab==='npa'?x.type==='NPA':x.type==='Deposit');if(q)rows=rows.filter(x=>[x.name,x.cif,...x.loans.map(l=>l.accNo)].some(v=>String(v||'').toLowerCase().includes(q)));document.querySelector('#records').innerHTML=rows.length?rows.map(x=>{const total=x.loans.reduce((a,l)=>a+Number(l.balance||0),0);return `<article class="card"><div class="cardhead"><div><div class="name">${esc(x.name)}</div><div class="meta">CIF: ${esc(x.cif)} • ${esc(x.branch)}</div></div><div class="total" style="color:${x.type==='Deposit'?'#15803d':'#b91c1c'}">${money(total)}</div></div>${x.loans.map(l=>`<div class="loan"><div class="loanline"><span>A/C: ${esc(l.accNo)} (${esc(l.type||'Loan')})</span><span>${money(l.balance)}</span></div><div class="grid"><div><span>Limit:</span> ${money(l.limit)}</div><div><span>NPA Date:</span> ${esc(l.npaDate||'-')}</div><div><span>MOI Overdue:</span> ${esc(l.moiDate||'-')}</div><div><span>Status:</span> ${esc(l.docStatus||'Live')}</div></div></div>`).join('')}${x.followUp?`<div class="follow"><b>அடுத்த விசிட் / PTP:</b> ${esc(x.followUp.nextDate||'-')} &nbsp; <b>உறுதித் தொகை:</b> ${money(x.followUp.amount)}<br><b>பேசியவர்:</b> ${esc(x.followUp.contactPerson||'-')} (${esc(x.followUp.visitType||'-')})<br><b>குறிப்பு:</b> ${esc(x.followUp.remarks||'-')}</div>`:''}<div class="actions"><button class="act edit" data-edit="${esc(x.cif)}">✏️ Edit Details</button><button class="act followbtn" data-follow="${esc(x.cif)}">📅 ஃபாலோ-அப் பதிவு</button></div></article>`}).join(''):'<div class="empty">இப்போது எந்தப் பதிவுகளும் இல்லை.</div>';document.querySelector('#todayCount').textContent=data.filter(x=>x.followUp?.nextDate===today()).length;document.querySelector('#npaCount').textContent=data.filter(x=>x.type==='NPA').length;document.querySelector('#depositCount').textContent=data.filter(x=>x.type==='Deposit').length}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function loanRow(l={}){const div=document.createElement('div');div.className='loanrow';div.innerHTML=`<h3>Loan / Account</h3><div class="loanform"><div class="form"><label>Account Number</label><input class="acc" value="${esc(l.accNo||'')}"></div><div class="form"><label>Scheme / Type</label><input class="type" value="${esc(l.type||'')}"></div><div class="form"><label>Limit ₹</label><input class="limit" type="number" value="${Number(l.limit||0)}"></div><div class="form"><label>Balance O/S ₹</label><input class="balance" type="number" value="${Number(l.balance||0)}"></div><div class="form"><label>NPA Date</label><input class="npa" type="date" value="${l.npaDate&&l.npaDate!=='-'?esc(l.npaDate):''}"></div><div class="form"><label>MOI Overdue Date</label><input class="moi" type="date" value="${l.moiDate&&l.moiDate!=='-'?esc(l.moiDate):''}"></div><div class="form"><label>Category</label><select class="category">${['Sub-Standard','Doubtful-1','Doubtful-2','Doubtful-3','Loss','Maturity Due'].map(v=>`<option ${l.category===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="form"><label>Document Status</label><select class="doc">${['Live Documents','Time Barred','Active'].map(v=>`<option ${l.docStatus===v?'selected':''}>${v}</option>`).join('')}</select></div></div>`;document.querySelector('#loanEditor').append(div)}
function openRecord(cif){activeCif=cif||null;const x=data.find(a=>a.cif===cif);document.querySelector('#recordTitle').textContent=x?'கணக்கு விவரங்களை எடிட் செய்தல்':'புதிய CIF பதிவு';document.querySelector('#recordCif').value=cif||'';document.querySelector('#cif').value=x?.cif||'';document.querySelector('#cif').readOnly=!!x;document.querySelector('#name').value=x?.name||'';document.querySelector('#branch').value=x?.branch||'VALAPADI';document.querySelector('#recordType').value=x?.type||'NPA';const e=document.querySelector('#loanEditor');e.innerHTML='';(x?.loans?.length?x.loans:[{}]).forEach(loanRow);document.querySelector('#recordModal').classList.add('open')}
function openFollow(cif){activeCif=cif;const f=data.find(x=>x.cif===cif)?.followUp||{};document.querySelector('#contact').value=f.contactPerson||'';document.querySelector('#visit').value=f.visitType||'கள ஆய்வு (Field Visit)';document.querySelector('#nextDate').value=f.nextDate||today();document.querySelector('#amount').value=f.amount||'';document.querySelector('#remarks').value=f.remarks||'';document.querySelector('#followModal').classList.add('open')}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelector('#search').addEventListener('input',render);document.querySelector('#newRecord').onclick=()=>openRecord();document.querySelector('#addLoan').onclick=()=>loanRow();document.querySelector('#records').addEventListener('click',e=>{const edit=e.target.closest('[data-edit]'),follow=e.target.closest('[data-follow]');if(edit)openRecord(edit.dataset.edit);if(follow)openFollow(follow.dataset.follow)});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.querySelector('#'+b.dataset.close).classList.remove('open'));document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open')}));
document.querySelector('#saveRecord').onclick=()=>{const cif=document.querySelector('#cif').value.trim(),name=document.querySelector('#name').value.trim();if(!cif||!name){alert('CIF Number and Borrower Name are required.');return}const loans=[...document.querySelectorAll('.loanrow')].map(r=>({accNo:r.querySelector('.acc').value.trim(),type:r.querySelector('.type').value.trim(),limit:Number(r.querySelector('.limit').value||0),balance:Number(r.querySelector('.balance').value||0),npaDate:r.querySelector('.npa').value||'-',moiDate:r.querySelector('.moi').value||'-',category:r.querySelector('.category').value,docStatus:r.querySelector('.doc').value}));if(!loans.length||loans.some(l=>!l.accNo)){alert('Enter an account number for each loan.');return}const item={cif,name,branch:document.querySelector('#branch').value.trim(),type:document.querySelector('#recordType').value,loans,...(data.find(x=>x.cif===activeCif)?.followUp?{followUp:data.find(x=>x.cif===activeCif).followUp}:{})};if(activeCif){data=data.map(x=>x.cif===activeCif?item:x)}else{if(data.some(x=>x.cif===cif)){alert('That CIF already exists.');return}data.push(item)}document.querySelector('#recordModal').classList.remove('open');persist()};document.querySelector('#saveFollow').onclick=()=>{const x=data.find(a=>a.cif===activeCif);if(!x)return;x.followUp={contactPerson:document.querySelector('#contact').value.trim(),visitType:document.querySelector('#visit').value,nextDate:document.querySelector('#nextDate').value,amount:Number(document.querySelector('#amount').value||0),remarks:document.querySelector('#remarks').value.trim()};document.querySelector('#followModal').classList.remove('open');persist()};render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
</script></body></html>
